name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'python/**'
  workflow_dispatch:

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Calculate Version (CalVer)
        id: calver
        run: |
          PKG_NAME="acedatacloud-x402"
          DATE_PREFIX=$(date -u +'%Y.%-m.%-d')
          echo "Package: $PKG_NAME"
          echo "Date prefix (UTC): $DATE_PREFIX"
          VERSION=$({ DATE_PREFIX=$DATE_PREFIX PKG_NAME=$PKG_NAME python3 -c "
          import json, os, urllib.request
          name = os.environ['PKG_NAME']
          prefix = os.environ['DATE_PREFIX']
          try:
              with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/json', timeout=10) as r:
                  data = json.load(r)
                  versions = list(data.get('releases', {}).keys())
          except Exception:
              versions = []
          
          # Filter versions starting with prefix
          relevant = [v for v in versions if v.startswith(prefix + '.')]
          max_n = 0
          for v in relevant:
              try:
                  n = int(v.split('.')[-1])
                  if n > max_n:
                      max_n = n
              except ValueError:
                  pass
          print(f'{prefix}.{max_n + 1}')
          " || echo "$DATE_PREFIX.error"; })
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.calver.outputs.version }}"
          if [[ "$VERSION" == *".error"* ]]; then
            echo "Error computing version"
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/pyproject.toml
          cat python/pyproject.toml | grep "^version ="

      - name: Install build tool
        run: python3 -m pip install --upgrade build

      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd python
          python -m build
          twine upload dist/*
