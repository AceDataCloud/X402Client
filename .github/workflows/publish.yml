name: Publish To npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Compute CalVer version
        id: version
        # Version format: YYYY.MDD.BUILD (e.g. 2026.419.0) — matches @acedatacloud/sdk.
        # MDD = month*100 + day, so Apr 19 → 419 and Dec 3 → 1203. Keeps semver 3-part.
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          YEAR=$(date -u +'%Y')
          MONTH=$(date -u +'%-m')
          DAY=$(date -u +'%-d')
          MDD=$((MONTH * 100 + DAY))
          DATE_PREFIX="${YEAR}.${MDD}"
          echo "Package: $PKG_NAME"
          echo "Date prefix (UTC): $DATE_PREFIX"

          LATEST_BUILD=$(PKG_NAME="$PKG_NAME" DATE_PREFIX="$DATE_PREFIX" node -e "
            const https = require('https');
            const name = process.env.PKG_NAME;
            const prefix = process.env.DATE_PREFIX;
            const url = 'https://registry.npmjs.org/' + name.replace('@', '%40');
            https.get(url, (res) => {
              let body = '';
              res.on('data', (c) => (body += c));
              res.on('end', () => {
                if (res.statusCode === 404) { console.log(0); return; }
                let versions = [];
                try { versions = Object.keys(JSON.parse(body).versions || {}); }
                catch (e) { console.log(0); return; }
                const today = versions.filter((v) => v.startsWith(prefix + '.'));
                if (today.length === 0) { console.log(0); return; }
                const builds = today.map((v) => {
                  const parts = v.split('.');
                  return parts.length === 3 ? Number.parseInt(parts[2], 10) : 0;
                });
                console.log(Math.max(...builds) + 1);
              });
            }).on('error', () => console.log(0));
          ")

          VERSION="${DATE_PREFIX}.${LATEST_BUILD}"
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version into package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          grep -m1 '"version"' package.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Validate publish tarball
        run: npm pack --json --dry-run

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            typescript/package.json
            typescript/package-lock.json
            typescript/dist/
            typescript/README.md
          if-no-files-found: warn

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@acedatacloud/x402-client/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --title "v${{ needs.build.outputs.version }}" \
            --generate-notes \
            --repo '${{ github.repository }}' || echo "Release already exists, skipping"
